  help       = "collect the pivot history"

[[option]]
  name       = "useApprox"
  category   = "expert"
  long       = "use-approx"
  type       = "bool"
  default    = "false"
  help       = "attempt to use an approximate solver"

[[option]]
  name       = "maxApproxDepth"
  category   = "expert"
