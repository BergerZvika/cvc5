  category   = "expert"
  long       = "rr-turns=N"
  type       = "int64_t"
  default    = "3"
  help       = "round robin turn"

[[option]]
  name       = "replayEarlyCloseDepths"
  category   = "expert"
  long       = "replay-early-close-depth=N"
  type       = "int64_t"
