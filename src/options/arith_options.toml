  long       = "nl-ext-rbound"
  type       = "bool"
  default    = "false"
  help       = "use resolution-style inference for inferring new bounds in non-linear incremental linearization solver"

[[option]]
  name       = "nlExtFactor"
  category   = "regular"
  long       = "nl-ext-factor"
  type       = "bool"
  default    = "true"
  help       = "use factoring inference in non-linear incremental linearization solver"

[[option]]
