[[option]]
  name       = "piAndLemmaMode"
  category   = "expert"
  long       = "piand-lemmas=MODE"
  type       = "PIAndLemmaMode"
  default    = "NONE"
  help       = "select which extra PIAND lemmas to emit (default 'none', see --piand-lemmas=help)"
  help_mode  = "Extra optional lemma schemas for the parametric integer-and (PIAND) nl-ext solver. Select 'all' to enable every schema, or a specific name to enable just one."
[[option.mode.NONE]]
  name = "none"
  help = "Do not emit any of the extra PIAND lemmas."
[[option.mode.ALL]]
  name = "all"
  help = "Emit every extra PIAND lemma (carry upper bound, LSB equivalence, width-monotone, lean init-refine, complement split)."
[[option.mode.CARRY]]
  name = "carry"
  help = "Emit only the initial-refine carry upper bound: 2*piand(k,x,y) <= x+y under x,y in [0,2^k)."
[[option.mode.LSB]]
  name = "lsb"
  help = "Emit only the initial-refine LSB equivalence: piand(k,x,y) mod 2 = (x mod 2)*(y mod 2) under k>0."
[[option.mode.WIDTH_MONOTONE]]
  name = "width-monotone"
  help = "Emit only the pairwise full-refine width-narrowing lemma: x,y in [0,2^k1) /\\ k1<=k2 => piand(k1,x,y) = piand(k2,x,y)."
[[option.mode.COMPLEMENT]]
  name = "complement"
  help = "Emit only the initial-refine complement split: x,y in [0,2^k) => piand(k,x,y) + piand(k,x,2^k-1-y) = x. Every bit of x meets a set bit in exactly one of y and ~y, so the two conjunctions partition x. It is the only schema here that reasons about a piand and the piand of the COMPLEMENT of its argument together, which is what a subset hypothesis such as `(~a | b) = ones` -- the shape the must-be-consistent-bits predicate of the icfb benchmarks is stated in -- reduces to; without it cvc5 cannot derive `a & b = a` from it at symbolic width. It introduces the term piand(k,x,2^k-1-y); the complement of that folds back to piand(k,x,y), so the chain does not grow, and introduced terms are recorded and never expanded again."
[[option.mode.MASK]]
  name = "mask"
  help = "Emit only the initial-refine constant low-mask evaluation: when one argument is the constant 2^j-1 (a run of j low ones, j>=1), piand(k,2^j-1,y) = y mod 2^min(j,k) for y>=0, split into the two guarded cases k>=j and 1<=k<j so that the common case carries the CONSTANT modulus 2^j. The PBV-to-int translation emits piand(k,1,y) for every `pbvand x 1` and every `pbvor x 1` -- bit-0 extraction, which is pervasive in the width-parametric MUL/UDIV/UREM lemmas -- and the rewriter cannot fold it because the folding rules for a constant argument all require a CONSTANT k. Without this the solver must discover bit-0 of a term through the generic piand refinement loop; there is already a `y=1` case there, but it is model-filtered, so it only fires once a candidate model happens to set the argument to 1. This states it up front and eliminates the piand term outright."
[[option.mode.LEAN]]
  name = "lean"
  help = "Emit the lean iand-style initial refinement (same lemmas as --piand-lean-refine): the tight bounds, dropping the heavy default init-refine lemmas (max-bounds, min-x/y, idempotence, symmetry term, one-sided LSB)."

[[option]]
  name       = "expRewriteMode"
  category   = "expert"
  long       = "arith-exp-rewrites=LIST"
  type       = "std::string"
  default    = "\"none\""
  help       = "comma-separated list of extra Kind::EXP rewrite schemas, run during normalization and deleting EXP nodes before the nl-ext solver sees them. Combine freely, e.g. 'unroll,const' or 'compose,fuse-base'. Tokens: none (default, nothing); swine (the preprocessing of Frohn & Giesl Sect. 4.1, minus the composition rule this solver cannot host as a rewrite: const,fuse-base,unroll. Recognised on THIS axis only -- it used to be accepted on --arith-exp-lemmas as well, where it selected a single family by accident of a shared token name); const (EXP(s,0)->1, EXP(s,1)->s, EXP(1,t)->1); unroll (EXP(s,c) -> s*...*s for constant 2 <= c <= --arith-exp-unroll-bound. POSITIVE constant exponents only: a negative constant would have to unroll to '1 div (s*...*s)', and since unrolling deletes the EXP node it would also delete every axiom defining the term -- which produced wrong 'sat' answers, e.g. 's=0 /\\ exp(s,-1) = -1'. Negative exponents are left as EXP terms, where neg-abs, bnd4, neg-one and bnd3 already define every case; --arith-exp-neg-recip relates exp(s,t) to 1 div exp(s,-t) as a lemma instead, which keeps the term); fuse-base (same-exponent product fusion EXP(s,a)*EXP(t,a) -> EXP(s*t,a)); const-compose (a legacy alias, now the same as const, see below); pbv (the tuned set for the PBV-to-int workload, exactly equivalent to 'unroll,const' -- it used to include 'compose', until that rewrite was removed as unsound; the guarded composition lemma is in --arith-exp-lemmas=pbv instead. The same token on --arith-exp-lemmas selects that option's own pbv set; each axis expands it to its own rewrites/lemmas); all (every schema EXCEPT unroll, which must always be requested explicitly since it can blow up term size). Note that 'const' and 'unroll' can equally be named on --arith-exp-lemmas, and the two axes are OR-ed for these two tokens: either spelling turns the schema on. They are the only rewrite schemas readable from that axis -- 'fuse-base' names a lemma family there, not this rewrite. The lemma-axis aggregates 'exp' and 'all' both imply const and unroll, so --arith-exp-lemmas=exp already unrolls without anything on this axis; --arith-exp-lemmas=exp-full implies them too, differing from 'exp' only in the two options it declines to switch on. 'exp' itself is a --arith-exp-lemmas aggregate and is NOT recognised here; naming it on this axis selects nothing, exactly as any unrecognised token does. There is also deliberately NO exponent composition EXP(EXP(x,y),z) -> EXP(x,y*z) on this axis: the EIA argument reads a negative exponent as its absolute value, but here a negative exponent gives 1 div x^|t|, and for x=y=z=-6 the left side is 0 while the right side is (-6)^36 -- as a rewrite it turned a satisfiable assertion into 'unsat'. It needs y >= 0 /\\ z >= 0, which a syntactic rewriter cannot discharge, so it now exists only as the guarded lemma --arith-exp-lemmas=compose. 'swine' and 'const-compose' therefore no longer select it. There is deliberately NO same-base fusion EXP(s,a)*EXP(s,b) -> EXP(s,a+b) on this axis: it is unsound under cvc5's '**' (EXP(s,1)*EXP(s,-1) is 0 for s >= 2 while EXP(s,0) is 1), as Sect. 4.1 also notes, and it has been removed. Its sound counterpart is the guarded lemma --arith-exp-lemmas=fuse."

[[option]]
  name       = "expRewriteUnrollBound"
  category   = "expert"
  long       = "arith-exp-unroll-bound=N"
  type       = "uint64_t"
  default    = "8"
  help       = "upper bound on the positive constant exponent c that --arith-exp-rewrites=unroll will unroll EXP(s,c) into a product of c copies of s (negative constants are never unrolled). Default 8, raised from 2: the LoAT/TPDB workload is full of polynomial powers with constant exponents 3-6 that stay opaque EXP terms at the lower bound, and unrolling them is what lets ordinary nonlinear arithmetic see them at all. Note this only has an effect when 'unroll' is actually selected -- on --arith-exp-rewrites, or on --arith-exp-lemmas, which reads the same token (directly, or via its 'exp' or 'all' aggregates) -- which it is not by default, so raising the bound changes nothing on its own."

[[option]]
  name       = "expPhasing"
  category   = "expert"
  long       = "arith-exp-phasing"
  type       = "bool"
  default    = "false"
  help       = "Equivalent to naming 'phasing' in --arith-exp-lemmas (also implied by that option's 'pbv' set); the two are OR-ed, so either turns it on, and neither is implied by the 'all'/'all-lemmas' aggregates. SwInE phasing (Frohn & Giesl, Sect. 5 / Alg. 3): alternate a sat-phase, whose candidate models are constrained by -2^b <= t <= 2^b on the exponent of every relevant exp(s,t), with an unconstrained unsat-phase, incrementing b (so the bound doubles) on every unsat-phase counterexample, which is discarded without refinement as in Alg. 3. This biases the search towards small exponents, so satisfiable instances with a small solution are found before the interpolation lemmas blow up. Each level-b bound is emitted as an equivalence 'g_b <=> -2^b <= t <= 2^b' with g_b fresh, and the SAT solver is asked to decide g_b true; the two phases are then the two sides of that case split. b starts at 1 and is not capped."

[[option]]
  name       = "expNegRecipMode"
  category   = "expert"
  long       = "arith-exp-neg-recip=MODE"
  type       = "ExpNegRecipMode"
  default    = "OFF"
  help       = "select where to emit the EXP negative-reciprocal lemma exp(s,t) = 1 div exp(s,-t) (default 'off', see --arith-exp-neg-recip=help). The 'refine' placement is also selected by the 'neg-recip' token of --arith-exp-lemmas, which 'exp-full' includes; the two spellings are OR-ed"
  help_mode  = "Controls the EXP negative-reciprocal lemma exp(s,t) = 1 div exp(s,-t), which relates a power to the reciprocal of its negated-exponent mirror."
[[option.mode.OFF]]
  name = "off"
  help = "Do not emit the negative-reciprocal lemma."
[[option.mode.INIT]]
  name = "init"
  help = "Emit the negative-reciprocal lemma once per EXP term as an initial-refine axiom."
[[option.mode.REFINE]]
  name = "refine"
  help = "Emit the negative-reciprocal lemma during the full-refinement loop for each EXP term whose model value is incorrect."

[[option]]
  name       = "expBoundingMode"
  category   = "expert"
  long       = "arith-exp-bounding=MODE"
  type       = "ExpBoundingMode"
  default    = "NONE"
  help       = "where the bounding lemmas bnd2/bnd3/bnd5 are emitted (default 'none'; naming 'bounding' in --arith-exp-lemmas raises the default to 'both', see --arith-exp-bounding=help)"
  help_mode  = "Where the bounding lemmas bnd2/bnd3/bnd5 are emitted.\n\nThis option and the 'bounding' token of --arith-exp-lemmas are two spellings of the same switch. The effective mode is: this option's value whenever it is given explicitly; otherwise 'both' if 'bounding' is named in --arith-exp-lemmas (directly or via the 'all'/'all-lemmas' aggregates), and 'none' if it is not. So '--arith-exp-lemmas=bounding' alone means 'both', '--arith-exp-bounding=init' alone means 'init', and '--arith-exp-lemmas=bounding --arith-exp-bounding=none' turns the family off.\n\nIn Frohn & Giesl, Bounding is one of the kinds ComputeLemmas produces, filtered by 'A does not satisfy psi' (Alg. 2 line 10) like every other kind. cvc5 instead emitted bnd2/bnd3/bnd5 once per term as initial-refine axioms, which means bnd5 -- whose conclusion exp(s,t) > s*t+1 is non-linear -- is asserted eagerly for every term whether the model needs it or not.\n\nNote bnd1 (t=0 => exp=1) and bnd4 (s=1 => exp=1) are emitted unconditionally at initial refine in every mode: they are cheap, linear, and independent of --arith-exp-lemmas."
[[option.mode.NONE]]
  name = "none"
  help = "DEFAULT when 'bounding' is not named in --arith-exp-lemmas. Emit no bnd2/bnd3/bnd5 at all, in either place. Naming it explicitly also overrides that list, so it turns the family off even under --arith-exp-lemmas=bounding."
[[option.mode.INIT]]
  name = "init"
  help = "Static axioms at initial refine, one batch per EXP term, whether or not any model violates them. The eager treatment, and the one the recorded benchmark baselines were taken with."
[[option.mode.REFINE]]
  name = "refine"
  help = "A live refinement family: for each model-violating term, emit only those of bnd2/bnd3/bnd5 that the candidate model actually violates, from the full-refinement loop. This is the paper's treatment. It also stops bnd5's non-linear conclusion from entering the term graph for terms whose model value never violates it. NOTE: a lemma the model satisfies pointwise is never emitted, so an axiom that constrains the search only globally (bnd5 is the known case) effectively disappears in this mode."
[[option.mode.BOTH]]
  name = "both"
  help = "DEFAULT when 'bounding' IS named in --arith-exp-lemmas. Static axioms at initial refine AND the model-filtered family in the refinement loop. Strictly more lemmas than either, and it covers bnd5, whose only-globally-constraining conclusion effectively disappears under 'refine'."

[[option]]
  name       = "expMonGeneral"
  category   = "expert"
  long       = "arith-exp-mon-general"
  type       = "bool"
  default    = "false"
  help       = "use the general monotonicity lemma of Frohn & Giesl (`mon`, Sect. 4.2.2) for pairs of EXP terms instead of the same-base-only pair lemmas. The general form 2<=s1 /\\ s1<=s2 /\\ 0<=t1 /\\ t1<=t2 /\\ 1<=t2 /\\ (s1<s2 \\/ t1<t2) => exp(s1,t1) < exp(s2,t2) relates two powers with DIFFERENT bases, which the pair lemmas (which require s1=s2 in the candidate model) never do -- e.g. it is what refutes 1<x<y /\\ 0<z /\\ exp(x,z)<exp(y,z). It is strictly stronger than the two same-base lemmas, which are therefore suppressed while it is on, and it is scanned over every pair of EXP terms rather than only pairs whose first element is itself model-violating. Off by default. Equivalent to naming 'mon' in --arith-exp-lemmas; the two are OR-ed, so either turns it on. Neither spelling is implied by the 'all'/'all-lemmas' aggregates, since turning it on changes the lemmas emitted on every EXP problem and suppresses two lemmas that are otherwise always on."

[[option]]
  name       = "expLemmasMode"
  category   = "expert"
  long       = "arith-exp-lemmas=LIST"
  type       = "std::string"
  default    = "\"none\""
  help       = "comma-separated list of SwInE-style EXP refinement lemma families emitted by the ExpSolver (Frohn & Giesl). Combine freely, e.g. 'interpolation,prime' or 'symmetry,interpolation'. Tokens: none (default); symmetry (sym1 and sym2 -- the two parity-conditional lemmas exp(s,t) = exp(-s,t) for even t and exp(s,t) = -exp(-s,t) for odd t -- emitted in the full-refinement loop for model-violating terms. The paper's third symmetry lemma, sym3 (exp(s,t) = exp(s,-t)), is not among them and no longer exists: it is UNSOUND under '**', which gives 1 div exp(s,-t) for a negative exponent rather than the paper's s^|t| reading, so for s=2, t=1 it claims 2 = 0. The sound mirror relation is --arith-exp-neg-recip); bounding (bnd2,bnd3,bnd5, emitted in BOTH placements -- initial-refine axioms and the model-filtered refinement loop -- unless --arith-exp-bounding is given explicitly to say where: t=1 => exp(s,t)=s; s=0/\\t!=0 => exp(s,t)=0 (forward only -- the converse exp(s,t)=0 => s=0 is false for t<0 with |s|>1, where '**' gives 1 div exp(s,-t) = 0, so 'refine' emits it separately under the guard t>=0); and bnd5 in generalized form s>=2 /\\ t>=2 => exp(s,t) >= s*s*(t-1), which on the paper's region s,t>1 /\\ s+t>4 strictly implies the published s+t>4/\\s>1/\\t>1 => exp(s,t) > s*t+1 and additionally covers s=t=2 -- bnd1/bnd4 are already emitted unconditionally); prime (divisibility by the smallest distinguishing prime); induction (equality unrolling by the model exponent gap); interpolation (ip2 upper / ip3 lower bilinear bounds); compose (two lemmas for a nested exp(exp(x,y),z): the GUARDED composition y >= 0 /\\ z >= 0 => exp(exp(x,y),z) = exp(x,y*z) -- the guard is required, since unguarded the identity fails whenever an exponent is negative -- and the negative-inner case y < 0 /\\ |x| > 1 /\\ z != 0 => exp(exp(x,y),z) = 0, which composition does not cover. This is now the only place exponent composition is applied; the unguarded rewrite has been removed); fuse (guarded same-base fusion s1=s2 /\\ t1>=0 /\\ t2>=0 => exp(s1,t1)*exp(s2,t2) = exp(s1,t1+t2); valid here because cvc5's EXP is SMT-LIB '**', which agrees with ordinary exponentiation on non-negative exponents, unlike the s^|t| reading that makes the unguarded rewrite unsound in the paper. Emitted only when the fused term already exists in the problem or folds to a constant, so it introduces no new terms and cannot diverge. NOT implied by 'all' or 'all-lemmas', so it must always be named explicitly -- it is kept explicit-only so recorded 'all' baselines are unaffected. This is the only 'fuse'; the unguarded rewrite that used to share the name on --arith-exp-rewrites has been removed as unsound); fuse-base (same-EXPONENT fusion exp(s,a)*exp(t,a) = exp(s*t,a), emitted in the full-refinement loop. UNGUARDED, and soundly so: unlike the same-base 'fuse' and unlike 'compose', this identity survives negative exponents under '**' -- for a < 0 every factor lies in {-1,0,1} and the two sides agree case by case. Verified exhaustively over [-9,9]^3 and on 400k random points. Like 'fuse' it is its own scan over all pairs and is emitted only when the fused term already exists in the problem or folds to a constant, so it introduces no new terms. The token is shared with --arith-exp-rewrites=fuse-base, which is the same identity applied as a rewrite instead); fuse-model ('fuse' matched on the candidate MODEL rather than syntactically: a pair exp(s1,t1), exp(s2,t2) whose sum names no EXP term is related to an existing exp(s3,t3) with s3 = s1 and t3 = t1 + t2 in the model, as s1=s2 /\\ s1=s3 /\\ t1>=0 /\\ t2>=0 /\\ t3=t1+t2 => exp(s1,t1)*exp(s2,t2) = exp(s3,t3); also pairs a term with itself. Implies 'fuse'. Introduces no term. NOT implied by 'all' or 'exp-full', so it must be named explicitly); mon (the general monotonicity lemma of Frohn & Giesl, Sect. 4.2.2: 2<=s1 /\\ s1<=s2 /\\ 0<=t1 /\\ t1<=t2 /\\ 1<=t2 /\\ (s1<s2 \\/ t1<t2) => exp(s1,t1) < exp(s2,t2), scanned over every pair of EXP terms; equivalent to the standalone --arith-exp-mon-general, and the two are OR-ed. NOT implied by 'all' or 'all-lemmas': it SUPPRESSES the two same-base pair monotonicity lemmas that are otherwise always on, so it must always be named explicitly); halving (the predecessor chain of --arith-exp-halving, at depth 1, which is that option's documented typical use: t >= 1 => exp(s,t) = s*exp(s,t-1). It used to switch on a singleton-elimination / congruence-decision pair as well; that pair has since been removed from the solver, so the token now selects the chain and nothing else. An explicit --arith-exp-halving=N wins, so naming the token never shortens a chain asked for elsewhere. NOT implied by 'all': the lemma INTRODUCES the term exp(s,t-1), and a selection that grows the term set has to be asked for -- the same reason 'unroll' is excluded from 'all' on the rewrite axis); negone-parity (the parity characterisation of the base -1, the same selection as the standalone --arith-exp-negone-parity, and the two are OR-ed: s = -1 => ite(t mod 2 = 0, exp(s,t) = 1, exp(s,t) = -1). NOT implied by 'all', and deliberately so -- alone among the tokens here it also switches on a PREPROCESSING pass (exp-negone-parity), which is where essentially all of its value is: on the 109 hardest LoAT instances the added assertion solves 84 where the ExpSolver lemma alone solves 3, because those problems never reach last-call effort and the solver never runs. Folding it into 'all' would therefore change what every recorded 'all' baseline means, so it must always be named explicitly); phasing (SwInE phasing, Sect. 5 / Alg. 3 -- the same search strategy as the standalone --arith-exp-phasing, and the two are OR-ed. NOT implied by 'all' or 'all-lemmas', which range over lemma families only); const (EXP(s,0)->1, EXP(s,1)->s, EXP(1,t)->1 -- NOT a lemma family but the REWRITE schema of --arith-exp-rewrites=const, which the ArithRewriter also reads off this axis; the two axes are OR-ed, so naming it here is exactly the same as naming it there. Implied by 'exp' and by 'all'); unroll (EXP(s,c) -> s*...*s for a positive constant 2 <= c <= --arith-exp-unroll-bound -- again the REWRITE schema of --arith-exp-rewrites=unroll, OR-ed across the two axes. Implied by 'exp' and, unlike on the rewrite axis where it is always explicit-only, by 'all' as well, since 'all' means all here. Negative constant exponents are never unrolled, for the soundness reason given under --arith-exp-rewrites); exp (the tuned set for the exponential / QF_EIA (LoAT) workload, the counterpart of 'pbv'. Exactly equivalent to 'symmetry,prime,induction,interpolation,compose,fuse,fuse-base,mon,negone-parity,halving,phasing,const,unroll' -- note it names negone-parity and halving, neither of which 'all' implies, and which are the two that matter most here: (-1)^t is the only exponential in most of these files, and the predecessor chain is what ties 2^t to 2^(t-1). It used to switch on two further options outside this list, a singleton-elimination / congruence-decision pair that discharged the degree-6 `size0*` equalities; that pair has been removed from the solver, and --arith-fermat-vacuity now covers those equalities on its own. Recognised on THIS axis only: 'exp' on --arith-exp-rewrites selects nothing); neg-recip (the negative-reciprocal lemma t < 0 => exp(s,t) = 1 div exp(s,-t), emitted in the full-refinement loop for model-violating terms -- exactly the 'refine' placement of --arith-exp-neg-recip, and the two are OR-ed. NOT implied by 'all': that option has its own default of 'off', and folding it in would change every recorded 'all' baseline. Selected by 'exp-full'); exp-full ('exp' plus 'neg-recip', i.e. exactly equivalent to 'symmetry,prime,induction,interpolation,compose,fuse,fuse-base,mon,negone-parity,halving,phasing,const,unroll,neg-recip'. The two spellings used to differ by a since-removed pair of options and were briefly interchangeable; the negative-reciprocal lemma in the full-refinement loop is now what separates them); exp-fuse-model ('exp-full' plus 'fuse-model', i.e. exactly equivalent to 'exp-full,fuse-model'); exp-no-phasing ('exp-full' without 'phasing', i.e. exactly equivalent to 'symmetry,prime,induction,interpolation,compose,fuse,fuse-base,mon,negone-parity,halving,const,unroll,neg-recip'. Phasing is a search strategy rather than a lemma family and can lose satisfiable instances, so this selects every lemma family of 'exp-full' under the plain search. It withholds only the token: an explicit --arith-exp-phasing is OR-ed in and still turns phasing on); pbv (the tuned set for the PBV-to-int workload, exactly equivalent to 'interpolation,symmetry,prime,induction,fuse,bounding,mon,phasing,compose' -- note it pulls in the three selections no other aggregate does (fuse, mon, phasing) and carries 'compose', which is where the removed composition rewrite went. The same token on --arith-exp-rewrites selects that option's own pbv set, 'unroll,compose,const'); all ('exp-fuse-model' plus every other family EXCEPT bounding -- i.e. exp-fuse-model's negone-parity, halving, neg-recip and fuse-model, plus symmetry, prime, induction, interpolation, compose, fuse, fuse-base, mon and phasing, plus the two rewrite schemas readable from this axis, const and unroll. Note two of those are not simply additive -- 'mon' SUPPRESSES the two same-base pair monotonicity lemmas that are otherwise always on, and 'phasing' is a search strategy rather than a lemma family -- so 'all' is a genuinely different configuration, not merely a larger one. 'bounding' is left out because it costs QF_EIA instances; write 'all,bounding' or give --arith-exp-bounding to add it. 'all' ALSO switches on the arithmetic preprocessing line --arith-exp-base-order --arith-pow2-norm --arith-witness-search=200 --arith-witness-search-signed --arith-witness-enum=20000 --pbv-to-int-reduce-mods=all, each as a default only, so an explicit value on the command line wins). The aggregates 'all-lemmas', 'symmetry-interpolation' and 'symmetry-refine' have been removed; a script still passing one of those selects nothing, exactly as any unrecognised token does. 'swine' is a --arith-exp-rewrites aggregate and is no longer recognised on this axis either."

[[option]]
  name       = "expNegOneParity"
  category   = "expert"
  long       = "arith-exp-negone-parity"
  type       = "bool"
  default    = "false"
  help       = "emit, for every EXP term exp(s,t), the initial-refine parity characterisation of the base -1: s = -1 => ite(t mod 2 = 0, exp(s,t) = 1, exp(s,t) = -1). Sound for every integer exponent, negative included, since '**' gives 1 div exp(s,-t) there, which is again +-1 and agrees with the Euclidean parity of t. This pins the VALUE of (-1)^t rather than merely its range, so a solver that case-splits on t mod 2 is left with an ordinary polynomial problem in each branch. The guard is a disequality-friendly s = -1 rather than a syntactic check, so it also fires on a symbolic base later found to be -1. It introduces no new EXP term. Off by default."

[[option]]
  name       = "expBaseOrder"
  category   = "expert"
  long       = "arith-exp-base-order"
  type       = "bool"
  default    = "false"
  help       = "relate the powers that share an EXPONENT but differ in their BASE. For the constant bases 2 <= b1 < b2 < ... occurring over one exponent e, assert `e >= 0 => (exp b1 e) >= 1` and `e >= 0 => (exp b(i+1) e) >= (exp bi e)` for consecutive pairs, from which the whole order follows transitively in linear rather than quadratic size. Sound as monotonicity of b |-> b^e on the positives; the guard makes it sound for a negative exponent too, where '**' sends every base >= 2 to 0. The set of powers is first CLOSED under the two ways an equal-exponent product arises, `(exp a e)*(exp b e) = (exp (a*b) e)` and `(exp (exp a e) c) = (exp (a^c) e)` for a positive constant c, each asserted under the same guard. Both INTRODUCE the fused power, which is the whole point -- `(2^e)^2` has to become `4^e` before `16^e >= 4^e` can say anything about it -- and this is what separates the pass from --arith-exp-lemmas=fuse-base, which states the same identity but only when the fused term already occurs and so never creates the term the ordering needs. Growth is bounded at one new power per product and stops once a fused base exceeds 2^24. Which of the two forms the input presents depends on the rewrites in force, since --arith-exp-rewrites=unroll turns the nested power into the product, so both are handled. Off by default. Also turns on --arith-rat-identity unless that option is given explicitly. This is what LoAT/TPDB `twn09.koat_2` needs: abstracting its five powers to plain variables constrained only by this order makes the benchmark an ordinary QF_NIA refutation that cvc5 discharges at once, so the base order is exactly the missing fact -- note it also wants branch-and-bound left ON, since the refutation case-splits on the squared variable."

[[option]]
  name       = "arithRatIdentity"
  category   = "expert"
  long       = "arith-rat-identity"
  type       = "bool"
  default    = "false"
  help       = "for every arithmetic equality L = R containing a real division, or powers of one base whose exponents differ by a constant, assert G => (L = R <=> N = 0), where N/D is L - R over a common denominator. G requires every divisor to be non-zero and, for each group of powers exp(s,e+c_i), that e + min c_i >= 0, under which each power is written as s^(c_i - min c_i) * exp(s, e + min c_i). The rewriter expands N into a polynomial, which is 0 when L = R is an identity of rational functions -- the shape of a verified recurrence solution (PURRS). Off by default, but implied by --arith-exp-base-order unless given explicitly (--no-arith-rat-identity turns it off there)."

[[option]]
  name       = "arithPow2Norm"
  category   = "expert"
  long       = "arith-pow2-norm"
  type       = "bool"
  default    = "false"
  help       = "normalise the shift arithmetic of PBV-to-int output -- `(x*2^e) mod 2^k` for a left shift, `x div 2^e` for a logical right shift -- so that bit-vector identities at a symbolic width become syntactic instead of needing nonlinear search. Two equivalences, applied bottom-up to the rewriter's polynomial normal form: div-fuse, `(x div p) div q -> x div (p*q)` for p,q > 0 (a chain of right shifts becomes one), and shl-past, which replaces each monomial `c*m*2^e1*...*2^en` of a `mod 2^K` dividend by `ite(e1>=0 /\\ ... /\\ e1+...+en >= K, 0, monomial)` (a left shift past the width is 0), or by 0 outright when that is provable, as for `2^K` itself or `2^K*2^t`. Side conditions are proved from the term structure and top-level `x >= c` facts. Runs after the final preprocessing rewrite and after --arith-witness-search. Nothing under a quantifier is touched. Off by default."

[[option]]
  name       = "arithWitnessSearch"
  category   = "expert"
  long       = "arith-witness-search=N"
  type       = "uint64_t"
  default    = "0"
  help       = "try to DISCHARGE an integer problem in preprocessing by constructing a model for it, using at most N local-repair steps (0 = off, the default; 200 is the measured sweet spot). Aimed at the triangular systems that termination/complexity analysers emit -- a long chain of definitions (`it2 = i2 + 1`, `3*it552 = <degree-6 poly>`, ...) resting on a handful of ROOT variables that carry all the actual constraints. Every non-root variable is functionally determined, so the pass PROPAGATES: it repeatedly finds an equality with exactly one unassigned variable occurring linearly, `c*v + Q = 0` with Q ground, and sets `v := -Q/c` when c divides Q -- establishing linearity by sampling v at 0, 1 and 2 rather than by matching a syntactic shape, so it does not care how the equality is spelled. Whatever propagation cannot determine becomes a root; roots start at the lower bound implied by the unit constraints on them and are then hill-climbed against a per-conjunct penalty measuring distance to satisfaction, so an unsatisfied `e > 0` pulls its roots in the direction that increases e, with random kicks to break plateaus. Every step re-propagates, so moving one root moves the whole derived chain. A candidate is accepted only after being re-checked against the ORIGINAL assertions by substitution and the rewriter, not by the fast evaluator that drove the search; the assertions then become `true` and the values are recorded as top-level substitutions, so the model is reported as usual. One-sided by construction: it can only ever conclude satisfiability, never `unsat`, and a failed search changes nothing. This is a different mechanism from the vacuity route of --arith-fermat-vacuity, which proves the hard equalities say nothing and deletes them; here they are kept and simply satisfied, which is why this also reaches instances such as LoAT/TPDB `twn05` where nothing is vacuous. Skipped outright on quantified input."

[[option]]
  name       = "arithWitnessEnum"
  category   = "expert"
  long       = "arith-witness-enum=N"
  type       = "uint64_t"
  default    = "0"
  help       = "try to discharge a parametric-width problem in preprocessing by EXHAUSTIVE SMALL-WIDTH ENUMERATION, evaluating at most N candidate assignments (0 = off, the default). Every integer variable that occurs as the exponent of a power of two -- the width k of a PBV-to-int translation -- is set to w = 1, 2, 3, ...; every other variable ranges over [0, 2^w), exhaustively while the space fits the remaining budget, and by seeded random sampling at the first width where it does not. A candidate the fast evaluator scores as a model is accepted only after the rewriter confirms it against the ORIGINAL assertions (at most 64 such checks), exactly as for --arith-witness-search, so the pass is one-sided: it can only ever conclude satisfiability, and a failed search changes nothing. Complements the hill-climb of --arith-witness-search, which is built for triangular systems and does not find the small counterexamples of an invalid bit-vector rewrite. Runs inside the same pass, before the hill-climb, and works with or without --arith-witness-search. Skipped when no variable is a power-of-two exponent, and on quantified input."

[[option]]
  name       = "arithWitnessSearchSigned"
  category   = "expert"
  long       = "arith-witness-search-signed"
  type       = "bool"
  default    = "false"
  help       = "let --arith-witness-search explore NEGATIVE root values. Two things otherwise confine the search to the non-negative orthant, and this switches off both. (1) The floor. The per-variable bound the search starts from is found by probing a unit constraint at 0, 1, ... 8 and taking the first value that satisfies it; that value is then also enforced as a hard lower bound on every subsequent move. For a constraint that bounds below -- `it16 >= 1`, `it1 = 2` -- it genuinely is one, but for one that bounds ABOVE, such as `it5 <= 0`, the upward probe returns 0 and the variable is pinned to exactly 0 for the rest of the search. With this option the probe value is enforced as a floor only after being CHECKED to be one, by re-probing the constraint below it and at far-negative sentinels; a constraint satisfied somewhere below contributes a starting point but no bound. (2) The plateau kick. When a sweep finds no improving move the search kicks a random root, and the kick is `+1`, `+2` or `+3` -- always upward, so a root that has settled at a positive value can never be carried across zero. With this option the kick takes either sign. Neither change affects what is ACCEPTED: a candidate is still verified against the original assertions by the rewriter, so the pass stays one-sided and can still only conclude satisfiability. Off by default, since it changes the trajectory of every search that reaches a plateau and therefore the instances a given step budget reaches. Needed for models that are genuinely negative -- LoAT/TPDB `twn09` wants `i4 = -2, i5 = -1`, which the floor on `i5 <= 0` and the upward-only kick together make unreachable at any budget."

[[option]]
  name       = "arithTuneForLogic"
  category   = "expert"
  long       = "arith-tune-for-logic=MODE"
  type       = "ArithTuneForLogicMode"
  default    = "NONE"
  help       = "pick an arithmetic strategy from the input logic instead of naming it on the command line (see --arith-tune-for-logic=help). The logic is read as DECLARED, before the solver widens it: widening enables theories cvc5 needs internally rather than ones the input asked for, and reading the logic afterwards fires the UFNIA rule on plain QF_NIA. Reading it as declared also keeps `ALL` distinct from `PBV`, which matters because `ALL` enables every theory including the parametric bit-vector one -- and `ALL` is what the LoAT benchmarks declare. Every mode supplies DEFAULTS only: an option given explicitly on the command line always wins, and nothing is ever switched off."
  help_mode  = "Which strategy to select from the declared logic. In every mode but 'none', a logic in the UFNIA family turns on --arith-fermat-vacuity; the modes differ in what, if anything, they do for a parametric bit-vector logic. The two rules never compete: a PBV logic is not in the UFNIA family and vice versa, so at most one fires for any given input. The UFNIA family is matched two ways -- by name, so anything spelled with UFNIA in it (UFNIA, QF_UFNIA, AUFNIA) is covered, and structurally (UF enabled, integers used, not linear), which additionally catches `ALL`."
[[option.mode.NONE]]
  name = "none"
  help = "DEFAULT. Select nothing; the logic is not consulted at all."
[[option.mode.FERMAT]]
  name = "fermat"
  help = "UFNIA-family logic turns on --arith-fermat-vacuity. A PBV logic is left completely alone. Use this when the vacuity pass is wanted on integer problems but the PBV configuration is being controlled by hand."
[[option.mode.ICP]]
  name = "icp"
  help = "As 'fermat', and additionally a PBV logic turns on --nl-icp, the original ICP-style propagation. Measured on the 496-file sat25 PBV set: 314 solved without it against 317 with it, which is a wash as a default -- but the two configurations together solve 352, so this is worth far more as a portfolio column than as a default. It is strongly positive on the `lemmas` category (35 -> 44) and negative on `ic` (102 -> 97) and `alive` (167 -> 164); a logic-driven rule cannot separate those, since all four categories declare the same PBV logic."
[[option.mode.ICP_FIX]]
  name = "icp-fix"
  help = "As 'fermat', and additionally a PBV logic turns on --nl-icp-fix, the corrected ICP candidate construction (divide by coefficient and denominator, track bounds on non-variable leaf terms as origins) rather than the original one. Pick between this and 'icp' by measuring; they are the same rule with different candidate construction."

[[option]]
  name       = "arithFermatVacuity"
  category   = "expert"
  long       = "arith-fermat-vacuity"
  type       = "bool"
  default    = "false"
  help       = "delete integer equalities that constrain nothing, certifying vacuity SYMBOLICALLY rather than by search. An equality `c*v + Q = 0` whose variable `v` occurs nowhere else, and occurs here only as the linear monomial `c*v`, is solvable for `v` at every assignment exactly when |c| divides Q identically -- and is then equivalent to `true`, taking every nonlinear monomial in it out of the problem. The identical-divisibility question is decided by reducing Q to a NORMAL FORM: coefficients mod p, and every exponent e >= 1 collapsed to ((e-1) mod (p-1)) + 1, which is Fermat's little theorem x^p = x read as a statement about exponents. Reduced polynomials have per-variable degree < p and are in bijection with the functions F_p^n -> F_p, so Q vanishes identically mod p iff its reduction is the zero polynomial; a composite modulus is split over its prime factors by the CRT, and a non-squarefree modulus is declined rather than guessed at. Deciding it this way keeps the cost flat: the obvious alternative, evaluating Q at all m^n residue tuples, is exponential in the variable count and has to be capped, whereas this costs one traversal of Q and is independent of how many variables Q has -- the LoAT/TPDB `size0*` residuals reach 10. Non-polynomial integer subterms (an `exp` with a symbolic exponent, an uninterpreted application) are treated as further universally quantified variables, which can only make the test decline, never accept wrongly. The eliminated variable is given the exact witness `v := -Q div c` in the top-level substitutions, so models are preserved and not merely satisfiability. Self-contained: it needs no other option. Off by default."

[[option]]
  name       = "arithFermatVacuitySkipModExp"
  category   = "expert"
  long       = "arith-fermat-vacuity-skip-mod-exp"
  type       = "bool"
  default    = "false"
  help       = "make --arith-fermat-vacuity leave alone any equality whose residual Q contains a `mod` whose MODULUS (second operand) contains an `exp` (or `^`) term -- `(mod t (exp 2 k))`, the shape the PBV-to-int translation emits for every width-k operation. An `exp` in the dividend only, `(mod (exp 2 k) m)`, does not trigger it. Such an equality is declined outright, i.e. neither certified vacuous nor deleted, so the Fermat exponent collapse is never applied to an exponential that serves as a modulus. No effect without --arith-fermat-vacuity, and no effect on equalities without that shape. Off by default."

[[option]]
  name       = "arithFermatVacuityMaxPrime"
  category   = "expert"
  long       = "arith-fermat-vacuity-max-prime=N"
  type       = "uint64_t"
  default    = "0"
  help       = "make --arith-fermat-vacuity decline any equality `c*v + Q = 0` whose coefficient |c| has a prime factor larger than N (0 = no bound, the default). The bound is on the PRIMES, not on c itself, so c = 6 = 2*3 passes with N = 3 while c = 1009 does not. The reason to bound them: the Fermat normal form over F_p has per-variable degree below p, so for a large p nothing collapses and Q is simply expanded in full, which is where the cost is; the small primes 2, 3, 5, 7 are where the collapse actually shrinks anything. Declined equalities are left exactly as written. No effect without --arith-fermat-vacuity."

[[option]]
  name       = "expValueOnly"
  category   = "expert"
  long       = "arith-exp-value-only"
  type       = "bool"
  default    = "false"
  help       = "make the EXP solver emit NO axioms at all -- no initial-refine lemmas, no lemma families, no monotonicity -- only the model-value refinement exp(c1,c2) = <value> for a term whose candidate model value is wrong. Every answer is then justified by evaluation alone: a 'sat' comes with a model in which every exp term has its true value, and no lemma can vouch for another. This is the sub-solver configuration --check-lemmas uses to test recorded lemmas, and it exists for that purpose; as a solving strategy it is deliberately weak, since it can prove nothing beyond what a finite set of evaluated points refutes. Off by default."

[[option]]
  name       = "expDivisibilityDepth"
  category   = "expert"
  long       = "arith-exp-divisibility=N"
  type       = "uint64_t"
  default    = "0"
  help       = "emit, for every EXP term exp(b,t) with a CONSTANT base b >= 2, the initial-refine divisibility chain t >= j => exp(b,t) mod b^j = 0, for j = 1..N (0 = off, the default). Each conclusion carries a constant modulus, so the family is linear in the EXP term and adds no new terms. cvc5 derives the j=1 case on its own -- `2 | 2^k` for k >= 1 falls out of the parity reasoning already present -- but not j >= 2: `(assert (>= k 2)) (assert (not (= (mod (** 2 k) 4) 0)))` does not close, and neither does the int.pow2 spelling. That gap is what blocks the finite-bit proofs in the width-parametric PBV lemmas, whose arguments run `t = x*s mod 2^k`, so `t mod 4 = (x*s) mod 4` only once `4 | 2^k` is available; sat25/lemmas/lemma_MUL_REF15_bw_k is the smallest example and is refuted by a mod-2 then mod-4 case split. N=8 is the measured sweet spot on that category (N=16 starts costing more than it buys). Note this does NOT reach the instances whose proof needs induction on the width itself, such as lemma_MUL_REF12_bw_k."

[[option]]
  name       = "expPowFuse"
  category   = "expert"
  long       = "arith-exp-pow-fuse=N"
  type       = "uint64_t"
  default    = "0"
  help       = "emit two UNGUARDED power identities over a constant base b >= 2 (0 or 1 = off, the default; N caps the fold). (P) for a product that already contains n identical factors (** b t), with 2 <= n <= N: (** b t)^n = (** b (n*t)). (N) for a nested power with a CONSTANT non-negative outer exponent c: (** (** b y) c) = (** b (y*c)). Neither carries a sign condition on the exponent, which is what separates them from the lemmas already available: --arith-exp-lemmas=fuse states s1=s2 /\\ t1>=0 /\\ t2>=0 => exp(s1,t1)*exp(s2,t2) = exp(s1,t1+t2) and =compose states y>=0 /\\ z>=0 => exp(exp(x,y),z) = exp(x,y*z). Those guards are required in general -- exp(b,1)*exp(b,-1) is 0 while exp(b,0) is 1 -- but vacuous here. With EQUAL exponents the two exponents cannot have opposite signs: for t < 0 every factor is `1 div b^|t|` = 0 for b >= 2, so the product is 0, and exp(b,n*t) with n*t < 0 is 0 too. With a constant non-negative outer exponent, y < 0 makes the inner power 0, so the left side is 0^c = 0 for c >= 1 while the right side has y*c < 0 and is also 0; for c = 0 both sides are 1. Verified exhaustively for b in [2,11], y in [-8,8], n in [1,5], c in [0,5]. cvc5 already derives the n=2 and c=2 cases -- 'unroll' turns a constant square into a product and the pair lemmas reach it -- but NOT n >= 3: `(** 2 y) * (** 2 y) * (** 2 y) = (** 2 (* 3 y))` does not close at any timeout, and neither does the `(** (** 2 y) 3)` spelling. (P) fires only on a product that already has n identical power factors, so it introduces one term per shape actually present rather than enumerating n. A PREPROCESSING pass rather than an ExpSolver lemma, for the same reason as --arith-exp-divisibility: stated up front the facts are available to the linear solver from the first round. Off by default."

[[option]]
  name       = "expProdDivides"
  category   = "expert"
  long       = "arith-exp-prod-divides=N"
  type       = "uint64_t"
  default    = "0"
  help       = "for every product M in the problem that has one or more (** b t_i) factors over a constant base b >= 2, and every distinct (** b u) term over that same base, emit the divisibility u >= 0 /\\ (t_1+...+t_n) >= u => M mod (** b u) = 0. N caps the number of such lemmas, since the pair count is quadratic in the number of power terms; pairs are taken in source order (0 = off, the default). This is the SYMBOLIC-modulus counterpart of --arith-exp-divisibility, whose moduli are the constants b^1..b^N: cvc5 derives neither on its own, and `(assert (>= k 1)) (assert (>= c k)) (assert (not (= (mod (** 2 c) (** 2 k)) 0)))` does not close. Stating only the pure power split `2^c = 2^k * 2^(c-k)` -- which the PBV width machinery already emits -- is NOT enough on the shift benchmarks: the solver will not multiply that equation through by the shifted value, so the fact has to be stated about the PRODUCT, which is what this option does. The motivating shape is a left shift past the width after pbv-to-int, where `(pbvshl (pbvshl X C1) C2)` becomes `X * 2^(C1+C2) - q*2^k` constrained to [0, 2^k), and showing it is 0 for C1+C2 >= k needs exactly `2^k | X * 2^(C1+C2)`; Alive/InstCombineShift228 is the smallest example and is unsolved at any timeout without this. Sound for every integer exponent, negative included: a negative t_i makes that factor `1 div b^|t_i|` = 0 for b >= 2, so M is 0 and every modulus divides it; otherwise M = e * b^T with T >= u, which b^u divides whatever the sign of the remaining factors e. The divisor is at least 1 under the guard, so the totalised modulus is the ordinary one. The equivalent skolem-witness spelling `M = (** b u) * w` closes the same benchmarks but introduces a fresh unconstrained integer per lemma, which measured five losses on Alive (AndOrXor_516/530/698/2494 and Select_575a, each solved in under 9s without this pass) for no additional gain, so the mod spelling is the one used. A PREPROCESSING pass rather than an ExpSolver lemma, and one that must run AFTER pbv-to-int, for the same reasons as --arith-exp-divisibility. Off by default: the lemmas are cheap but not free, and perturbing the search costs benchmarks that the base configuration already solves, so it has to be asked for."

[[option]]
  name       = "expHalvingDepth"
  category   = "expert"
  long       = "arith-exp-halving=N"
  type       = "uint64_t"
  default    = "0"
  help       = "emit, for every EXP term exp(s,t) in the problem, the initial-refine predecessor chain t-i >= 1 => exp(s,t-i) = s*exp(s,t-i-1) for i < N (0 = off, the default). Each step introduces the term exp(s,t-i-1), which is what makes the lemma useful and also what makes it need a bound: without one the chain would descend forever. The introduced terms are recorded so that they are never themselves unrolled. The typical use is N=1 on the PBV-to-int workload, where a signed comparison at symbolic width k needs 2^k = 2*2^(k-1) to relate the width power to the sign-bit threshold."

[[option]]
  name       = "nlExtExpDoubling"
  category   = "expert"
  long       = "nl-ext-exp-doubling"
  type       = "bool"
  default    = "false"
  help       = "emit the EXP doubling full-refine lemma: s_x=s_y /\\ t_y=t_x+1 => exp(s_y,t_y) = s_x*exp(s_x,t_x) (off by default)"

[[option]]
