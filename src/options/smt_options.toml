  help       = "output file for --check-lemmas=dump|both; defaults to <input>.lemmas.smt2 next to the input (lemmas.smt2 when reading stdin)"

[[option]]
  name       = "checkLemmasTimeout"
  category   = "common"
  long       = "check-lemmas-timeout=N"
  type       = "uint64_t"
  default    = "2000"
  help       = "time limit in milliseconds for each --check-lemmas sub-query (0 = none). The sub-queries are the consistency test and one validity query per recorded lemma, so the total is roughly (N+1) times this; they rarely conclude (the axiom-free subsolver can refute but seldom prove), and the evaluation stage that actually finds wrong lemmas is not subject to this limit. A query that runs out counts as inconclusive"

