[[option]]
  name       = "checkLemmas"
  category   = "common"
  long       = "check-lemmas=MODE"
  type       = "CheckLemmasMode"
  default    = "NONE"
  help       = "record every lemma the EXP solver sends during solving and, after every check-sat, test the recorded set (see --check-lemmas=help). In modes check, dump and both the answer to the INPUT formula (sat/unsat/unknown) is NOT printed: the only output is the answer on the lemma formula, i.e. the conjunction of all recorded lemmas -- `sat` followed by `lemmas ok (N checked)`, or `unknown` / `lemmas unknown (...)` when a sub-query is inconclusive -- while an unsat lemma formula or an invalid lemma raises an error. Mode dump runs no test and prints nothing; it only writes the file. Two tests are run in a fresh subsolver that has every --arith-exp-* lemma family switched OFF, so a wrong family cannot vouch for its own instances: (1) consistency -- the conjunction of all recorded lemmas must be satisfiable; unsat means the lemmas contradict each other and an error is raised; (2) validity -- the negation of each lemma must be unsatisfiable; sat means the lemma is not a theorem, and an error is raised together with the counter-model. A lemma set can pass (1) and fail (2) (each lemma consistent on its own but false), which is the shape of every EXP soundness bug found so far, so (2) is the test that matters; (1) is kept as the cheap global sanity check. Sub-queries that time out or return unknown are reported as warnings, never as errors. The dump modes write the same two tests to an SMT-LIB file (--check-lemmas-file) as push/pop blocks with the expected answer in a comment, to be run by hand with any solver. Off by default."
  help_mode  = "What to do with the recorded lemmas after check-sat."
[[option.mode.NONE]]
  name = "none"
  help = "Do not record lemmas."
[[option.mode.CHECK]]
  name = "check"
  help = "Run the consistency and validity tests in a subsolver; raise an error on failure."
[[option.mode.DUMP]]
  name = "dump"
  help = "Write the tests to an SMT-LIB file (--check-lemmas-file) and do not run them."
[[option.mode.BOTH]]
  name = "both"
  help = "Write the file and run the tests."

[[option]]
  name       = "checkLemmasFile"
  category   = "common"
  long       = "check-lemmas-file=FILE"
  type       = "std::string"
